[server]
host = "0.0.0.0"
port = 8080
data_dir = "data"
worker_threads = 4

[logging]
level = "info"
format = "text"

[storage]
db_url = "sqlite://data/flustra.db"
max_connections = 10

[security]
jwt_secret = "change-me-in-production"
token_expiry_secs = 86400

[plugins]
dir = "plugins/installed"
enabled = []

[cluster]
enabled = false
node_id = "node-1"
node_name = "primary"
gossip_interval_secs = 10

[[cluster.peers]]
id = "node-2"
address = "192.168.1.2:8081"
role = "replica"
