[package]
name = "flustra-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "request-id", "trace"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "uuid"] }

# Error handling
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
