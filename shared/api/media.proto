syntax = "proto3";
package flustra.api.media;

message MediaItem {
  string id = 1;
  string title = 2;
  string path = 3;
  string media_type = 4;
  int64 size_bytes = 5;
  optional int32 duration_secs = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional string codec = 9;
  optional int32 bitrate = 10;
  map<string, string> metadata = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListMediaRequest {
  optional string media_type = 1;
  optional string search = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMediaResponse {
  repeated MediaItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message Empty {}
